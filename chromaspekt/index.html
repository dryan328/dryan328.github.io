<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chromaspekt</title>
  <meta name="author" content="">
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&amp;display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  <link href="css/styles.css" rel="stylesheet">
</head>

<body>

  <div id="main-wrapper">

    <div class="container text-center pb-5">
      <img id="csklogo" src="images/csk-logo.png" alt="Logo" />
    </div>

    <footer class="container text-center">
      <p class="mb-3 mb-lg-0" id="copyright">© <span id="year"></span> David Ryan. All Rights Reserved.</p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
    crossorigin="anonymous"></script>
  <script>
    const n = "dave";
    const a = "davidryanmedia.com";
    const email = `${n}@${a}`;

    const mailElements = document.querySelectorAll('.mail');

    mailElements.forEach(el => {
      el.textContent = email;
      el.setAttribute('href', `mailto:${email}`);
    });

    const currentYear = new Date().getFullYear();
    document.getElementById("year").textContent = currentYear;
  </script>

</body>

</html>
